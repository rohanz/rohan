# Production is astro-site. Manual dispatch validates this exact checkout and
# deploys its artifact only after the reusable CI job succeeds.
name: Deploy to Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate:
    if: github.ref == 'refs/heads/astro-site'
    uses: ./.github/workflows/ci.yml
    with:
      upload-pages: true

  deploy:
    if: github.ref == 'refs/heads/astro-site'
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
