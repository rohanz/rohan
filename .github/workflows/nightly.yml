# The full browser suite (every test, including the @slow stress runs),
# sharded across four runners. GitHub only fires `schedule` triggers on the
# default branch, which is astro-site. Run it by hand from
# Actions > Nightly full suite > Run workflow.
name: Nightly full suite

on:
  schedule:
    - cron: '0 18 * * *' # 02:00 Singapore
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full:
    uses: ./.github/workflows/ci.yml
    with:
      suite: full
