# The full browser suite (every test, including the @slow stress runs),
# sharded across four runners. GitHub only fires `schedule` triggers for
# workflows on the repository's default branch; this repo's default is still
# `master` (the retired static site), so the schedule takes effect once
# astro-site is the default branch. Until then, run it by hand:
# Actions > Nightly full suite > Run workflow, branch astro-site.
name: Nightly full suite

on:
  schedule:
    - cron: '0 18 * * *' # 02:00 Singapore
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full:
    uses: ./.github/workflows/ci.yml
    with:
      suite: full
