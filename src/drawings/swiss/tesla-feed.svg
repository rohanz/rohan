<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  <style>
    .swiss-tesla-new { clip-path: inset(0 100% 0 0); transform-box: fill-box; }
    .swiss-tesla-cursor { opacity: 0; }
    @media (prefers-reduced-motion: no-preference) {
      .swiss-tesla-new { transition: clip-path .25s steps(24, end); }
      .swiss-card.is-hover .swiss-tesla-new { clip-path: inset(0); transition-delay: var(--tesla-delay); }
      .swiss-card.is-hover .swiss-tesla-cursor { animation: swiss-tesla-blink .8s steps(1, end) .85s infinite; }
    }
    @keyframes swiss-tesla-blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
  </style>
  <rect x="37" y="78" width="326" height="203" rx="2" stroke-width="1.25"/>
  <path d="M37 102h326" stroke-width="1.25"/>
  <g fill="currentColor" stroke="none"><circle cx="49" cy="90" r="2"/><circle cx="58" cy="90" r="2" opacity=".6"/><circle cx="67" cy="90" r="2" opacity=".3"/></g>
  <text x="350" y="93" text-anchor="end" font-family="'General Sans', sans-serif" fill="currentColor" stroke="none" font-size="8" letter-spacing="1.5">SUPERCHARGER / AUDIT</text>
  <g font-family="'General Sans', sans-serif" fill="currentColor" stroke="none" font-size="10.5" letter-spacing=".8" style="font-variant-numeric: tabular-nums">
    <text x="51" y="121">power_kw: 250 → 325</text>
    <text x="51" y="138">status: PERMIT → OPEN</text>
    <text x="51" y="155">stalls: 8 → 12</text>
    <text x="51" y="172">other_evs: false → true</text>
    <text class="swiss-tesla-new" style="--tesla-delay:0.00s" x="51" y="189">status_days: 116 <tspan fill="var(--accent)">→</tspan> 0</text>
    <text class="swiss-tesla-new" style="--tesla-delay:0.15s" x="51" y="206">connector: NACS <tspan fill="var(--accent)">→</tspan> NACS+CCS</text>
    <text class="swiss-tesla-new" style="--tesla-delay:0.30s" x="51" y="223">access: private <tspan fill="var(--accent)">→</tspan> public</text>
    <text class="swiss-tesla-new" style="--tesla-delay:0.45s" x="51" y="240">uptime_pct: 98.2 <tspan fill="var(--accent)">→</tspan> 99.7</text>
    <text class="swiss-tesla-new" style="--tesla-delay:0.60s" x="51" y="257">revision: 041 <tspan fill="var(--accent)">→</tspan> 042<tspan class="swiss-tesla-cursor"> ▏</tspan></text>
  </g>
</svg>
