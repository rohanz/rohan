<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  <style>
    .swiss-tesla-ring, .swiss-tesla-diff { opacity: 0; }
    .swiss-tesla-diff { transition: opacity .25s ease; }
    @keyframes swiss-tesla-audit {
      0% { opacity: 0; transform: translate(0, 0); }
      15%, 42% { opacity: 1; transform: translate(0, 0); }
      52% { opacity: 0; transform: translate(0, 0); }
      53%, 60% { opacity: 0; transform: translate(132px, 44px); }
      75%, 100% { opacity: 1; transform: translate(132px, 44px); }
    }
    @media (prefers-reduced-motion: no-preference) {
      .swiss-card.is-hover .swiss-tesla-ring { animation: swiss-tesla-audit 1.6s ease both; }
      .swiss-card.is-hover .swiss-tesla-added { opacity: 1; transition-delay: .2s; }
      .swiss-card.is-hover .swiss-tesla-removed { opacity: 1; transition-delay: 1s; }
    }
    @media (prefers-reduced-motion: reduce) { .swiss-tesla-diff { transition: none; } }
  </style>
  <g fill="currentColor" stroke="none" font-family="General Sans, sans-serif" font-size="10" letter-spacing="1.5" opacity=".55">
    <text x="40" y="52">NETWORK / CHANGELOG</text>
    <text x="360" y="253" text-anchor="end">FIELD-LEVEL DIFF</text>
  </g>
  <path d="M54 188l42-52 46-26 48 30 44 40 40-26 40-48 32 18" stroke-opacity=".35"/>
  <path d="M190 140l-26 60" stroke-opacity=".35"/>
  <g stroke-opacity=".18">
    <path d="M54 216h292M96 216v-8M142 216v-8M190 216v-8M234 216v-8M274 216v-8M314 216v-8"/>
  </g>
  <g fill="currentColor" stroke="none">
    <circle cx="54" cy="188" r="4"/><circle cx="96" cy="136" r="4"/>
    <circle cx="142" cy="110" r="4"/><circle cx="190" cy="140" r="4"/>
    <circle cx="234" cy="180" r="4"/><circle cx="274" cy="154" r="4"/>
    <circle cx="314" cy="106" r="4"/><circle cx="346" cy="124" r="4"/>
    <circle cx="164" cy="200" r="4"/>
  </g>
  <circle class="swiss-tesla-ring" cx="142" cy="110" r="12" stroke="var(--accent)"/>
  <path class="swiss-tesla-diff swiss-tesla-added" d="M163 91h10M168 86v10"/>
  <path class="swiss-tesla-diff swiss-tesla-removed" d="M295 175h10"/>
