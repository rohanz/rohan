<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  <style>
    /* The designated run, to scale: one column per iteration, y from 0.6015
       (240) to 0.6060 (100). On hover the best-so-far line draws in, joining
       the baseline and the two accepted iterations (3 and 6) directly; rejected
       tries (1, 2, 5) are hollow and the failed proposal (4) is a cross. Undrawn
       dashes sit one unit past the path start so the round cap leaves no dot. */
    .swiss-mle-line { stroke-dasharray: 100 102; stroke-dashoffset: 101; }
    .swiss-mle-win { fill-opacity: 0; }
    .swiss-mle-score { fill-opacity: .55; }
    @media (prefers-reduced-motion: no-preference) {
      .swiss-mle-line { transition: stroke-dashoffset .9s cubic-bezier(.2,.7,.2,1); }
      .swiss-mle-win { transition: fill-opacity .25s ease; }
      .swiss-mle-score { transition: fill-opacity .3s ease; }
      .swiss-card.is-hover .swiss-mle-line { stroke-dashoffset: 0; }
      .swiss-card.is-hover .swiss-mle-win { fill-opacity: 1; transition-delay: var(--d); }
      .swiss-card.is-hover .swiss-mle-score.end { fill-opacity: 1; transition-delay: .8s; }
    }
  </style>
  <!-- axis with one tick per iteration -->
  <path d="M40 252h320" stroke-width="1.25" stroke-opacity=".5"/>
  <path d="M104 252v6M152 252v6M200 252v6M248 252v6M296 252v6M344 252v6" stroke-width="1.25" stroke-opacity=".5"/>
  <!-- best-so-far: baseline, then accepted at iteration 3 and 6, joined directly -->
  <path class="swiss-mle-line" pathLength="100" d="M56 229.5 200 154.8 344 113.2" stroke="var(--accent)"/>
  <circle cx="56" cy="229.5" r="3.5" fill="currentColor" stroke="none"/>
  <g stroke-width="1.5"><circle cx="200" cy="154.8" r="4"/><circle cx="344" cy="113.2" r="4"/></g>
  <g fill="var(--accent)" stroke="none">
    <circle class="swiss-mle-win" style="--d: .35s" cx="200" cy="154.8" r="5"/>
    <circle class="swiss-mle-win" style="--d: .75s" cx="344" cy="113.2" r="5"/>
  </g>
  <!-- rejected tries and the failed proposal -->
  <g stroke-width="1.5" stroke-opacity=".6">
    <circle cx="104" cy="225.7" r="3.5"/>
    <circle cx="152" cy="234.4" r="3.5"/>
    <circle cx="296" cy="194.7" r="3.5"/>
    <path d="m244 238 8 8m0-8-8 8"/>
  </g>
  <!-- start and end scores -->
  <g font-family="'General Sans', sans-serif" font-size="11" letter-spacing=".5" fill="currentColor" stroke="none">
    <text class="swiss-mle-score" x="56" y="214" text-anchor="middle">0.6018</text>
    <text class="swiss-mle-score end" x="344" y="98" text-anchor="middle">0.6056</text>
  </g>
</svg>
