<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  <style>
    /* Keys rest on a transparent fill (not `none`) so the fill can fade in. */
    .swiss-chord-key { fill: transparent; }
    .swiss-chord-name { fill-opacity: 0; } /* paint opacity: text never leaves its layer, so no re-sharpen */
    /* black keys are the same ink outline, filled with whatever surface the card sits on */
    .swiss-chord-black rect { fill: var(--card-surface, var(--paper)); }
    @media (prefers-reduced-motion: no-preference) {
      .swiss-chord-key { transition: fill .3s ease; }
      .swiss-chord-name { transition: fill-opacity .4s ease; }
      /* The chord is played note by note, then named. Delays apply only on the
         way in; releasing clears every key together. */
      .swiss-card.is-hover .swiss-chord-key { fill: var(--accent); transition-delay: var(--d, 0s); }
      .swiss-card.is-hover .swiss-chord-name { fill-opacity: 1; transition-delay: .6s; }
    }
  </style>
  <text class="swiss-chord-name" x="40" y="108" font-family="'General Sans', sans-serif" fill="currentColor" stroke="none" font-size="32" font-weight="500">Cmaj7</text>
  <path d="M40 129h320M40 245h320" stroke-width="1.25"/>
  <rect class="swiss-chord-key" x="40" y="137" width="40" height="100"/>
  <rect x="80" y="137" width="40" height="100"/>
  <rect class="swiss-chord-key" style="--d: .15s" x="120" y="137" width="40" height="100"/>
  <rect x="160" y="137" width="40" height="100"/>
  <rect class="swiss-chord-key" style="--d: .3s" x="200" y="137" width="40" height="100"/>
  <rect x="240" y="137" width="40" height="100"/>
  <rect class="swiss-chord-key" style="--d: .45s" x="280" y="137" width="40" height="100"/>
  <rect x="320" y="137" width="40" height="100"/>
  <!-- black keys: same ink outline, filled with the card surface so they read as raised -->
  <g class="swiss-chord-black swiss-surface">
    <rect x="66" y="137" width="26" height="62"/>
    <rect x="106" y="137" width="26" height="62"/>
    <rect x="186" y="137" width="26" height="62"/>
    <rect x="226" y="137" width="26" height="62"/>
    <rect x="266" y="137" width="26" height="62"/>
  </g>
</svg>
