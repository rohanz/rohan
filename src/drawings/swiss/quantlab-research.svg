<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  <style>
    /* Fades use paint opacity (fill-opacity), not `opacity`: an opacity
       transition puts the text on its own layer and it re-sharpens when the
       fade ends. */
    .swiss-research-honest { clip-path: inset(0 100% 0 0); }
    .swiss-research-wedge, .swiss-research-label { fill-opacity: 0; }
    @media (prefers-reduced-motion: no-preference) {
      .swiss-research-honest { transition: clip-path .9s cubic-bezier(.2,.7,.2,1); }
      .swiss-research-wedge, .swiss-research-label { transition: fill-opacity .5s ease; }
      .swiss-card.is-hover .swiss-research-honest { clip-path: inset(0); }
      .swiss-card.is-hover .swiss-research-wedge { fill-opacity: .18; transition-delay: .9s; }
      .swiss-card.is-hover .swiss-research-label { fill-opacity: 1; transition-delay: .35s; }
    }
  </style>
  <g stroke-width="1.25" opacity=".12">
    <path d="M40 88h320M40 124h320M40 160h320M40 196h320M104 76v152M168 76v152M232 76v152M296 76v152M360 76v152"/>
  </g>
  <path d="M40 76v152h320M40 228v5M120 228v5M200 228v5M280 228v5M360 228v5" stroke-width="1.25" opacity=".5"/>
  <path class="swiss-research-wedge" fill="var(--accent)" d="M40 210 68 204 88 207 112 189 134 195 158 169 180 177 205 143 226 151 252 118 273 124 296 94 317 100 360 77 360 170 317 185 296 175 273 192 252 182 226 200 205 185 180 205 158 193 134 211 112 202 88 212 68 207 40 210Z" stroke="none"/>
  <path d="M40 210 68 204 88 207 112 189 134 195 158 169 180 177 205 143 226 151 252 118 273 124 296 94 317 100 360 77"/>
  <path class="swiss-research-honest" d="M40 210 68 207 88 212 112 202 134 211 158 193 180 205 205 185 226 200 252 182 273 192 296 175 317 185 360 170" stroke-dasharray="1 5"/>
  <g font-family="'General Sans', sans-serif" fill="currentColor" stroke="none" font-size="8" letter-spacing="1" opacity=".6">
    <text x="40" y="246">2020</text><text x="112" y="246">2021</text><text x="192" y="246">2022</text><text x="272" y="246">2023</text><text x="342" y="246">2024</text>
  </g>
  <text class="swiss-research-label" x="151" y="91" font-family="'General Sans', sans-serif" fill="currentColor" stroke="none" font-size="8" letter-spacing="1">SURVIVORSHIP +4.6%/YR</text>
  <g stroke-width="1.25"><path d="M40 270h22"/><path d="M171 270h22" stroke-dasharray="1 5"/></g>
  <g font-family="'General Sans', sans-serif" fill="currentColor" stroke="none" font-size="8" letter-spacing="1.2"><text x="70" y="273">BACKTEST</text><text x="201" y="273">LIVE / HONEST</text></g>
</svg>
