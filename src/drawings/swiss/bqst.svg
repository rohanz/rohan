  <style>
    /* The rotation is driven by a registered custom property and it is THAT property
       that transitions, not `transform`. Chrome cannot composite a custom-property
       transition, so every frame is a fresh vector redraw: no texture softening
       during the motion and no re-sharpen when it ends. */
    /* --bqst-angle is registered in swiss-cards.css (@property must live in a document stylesheet). */
    .swiss-bqst-dial, .swiss-bqst-needle { transform: rotate(var(--bqst-angle)); }
    @media (prefers-reduced-motion: no-preference) {
      .swiss-bqst-dial, .swiss-bqst-needle { transition: --bqst-angle .6s cubic-bezier(.2,.8,.3,1); }
      .swiss-card.is-hover .swiss-bqst-dial, .swiss-card.is-hover .swiss-bqst-needle { --bqst-angle: var(--bqst-turn); transition-delay: var(--bqst-delay); }
    }
    @media (prefers-reduced-motion: reduce) { .swiss-card.is-hover .swiss-bqst-dial, .swiss-card.is-hover .swiss-bqst-needle { --bqst-angle: 0deg; } }
  </style>
