    @media (prefers-reduced-motion: no-preference) {
      .swiss-sphere-route { transition: stroke-dashoffset .5s ease; }
      .swiss-sphere-orbits { transition: transform .8s ease; }
      .swiss-sphere-tip, .swiss-sphere-ring { transition: opacity .25s ease; }
      .swiss-card.is-hover .swiss-sphere-route { stroke-dashoffset: 0; transition-delay: var(--sphere-delay); }
      .swiss-card.is-hover .swiss-sphere-orbits { transform: rotate(12deg); }
      .swiss-card.is-hover .swiss-sphere-ring { opacity: 1; transition-delay: .3s; }
      .swiss-card.is-hover .swiss-sphere-tip { opacity: 1; transition-delay: .55s; }
    }
