      .swiss-card.is-hover .swiss-analyst-tick { stroke-dashoffset: 0; transition-delay: var(--swiss-analyst-delay); }
      .swiss-card.is-hover .swiss-analyst-stage { stroke: var(--accent); transition-delay: var(--swiss-analyst-delay); }
      .swiss-card.is-hover .swiss-analyst-stamp { opacity: 1; transform: scale(1); transition-delay: .6s; }
    }
